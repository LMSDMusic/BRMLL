<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BR Music Learning Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f0f4ff;
      --surface:     #ffffff;
      --blue:        #3b6ef8;
      --blue-hover:  #2a5ce0;
      --blue-light:  #e8effe;
      --text:        #1a1f36;
      --text-muted:  #6b7280;
      --border:      #dde3f0;
      --error:       #e53e3e;
      --error-bg:    #fff5f5;
      --success:     #2f855a;
      --success-bg:  #f0fff4;
      --radius:      14px;
      --shadow:      0 4px 24px rgba(59, 110, 248, 0.10);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.5;
      pointer-events: none;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 0 0 32px;
      width: 100%;
      max-width: 420px;
      position: relative;
      animation: cardIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      overflow: hidden;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .card-header {
      text-align: center;
      margin-bottom: 0;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: var(--blue-light);
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      color: var(--blue);
    }

    .card-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.7rem;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ── Form Fields ── */
    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text);
      background: #fafbff;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input::placeholder { color: #b0b8d0; }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 110, 248, 0.12);
      background: #fff;
    }

    /* Passcode field wrapper (for show/hide toggle) */
    .input-wrapper {
      position: relative;
    }

    .input-wrapper input { padding-right: 48px; }

    .toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .toggle-btn:hover { color: var(--blue); }
    .toggle-btn svg { width: 18px; height: 18px; }

    /* ── Submit Button ── */
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 10px rgba(59, 110, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      background: var(--blue-hover);
      box-shadow: 0 4px 16px rgba(59, 110, 248, 0.35);
    }

    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Alert Messages ── */
    .alert {
      border-radius: var(--radius);
      padding: 13px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-top: 18px;
      display: none;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.45;
    }

    .alert.show { display: flex; animation: alertIn 0.2s ease both; }

    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid #fed7d7;
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #c6f6d5;
    }

    .alert svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

    /* ── Welcome State ── */
    .welcome-wrap {
      text-align: center;
      padding: 8px 0 4px;
      display: none;
    }

    .welcome-wrap.show { display: block; animation: cardIn 0.35s ease both; }

    .welcome-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome-name span { color: var(--blue); }

    .welcome-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .btn-outline {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--blue);
      border: 1.5px solid var(--blue);
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-outline:hover { background: var(--blue-light); }

    /* ── Footer ── */
    .card-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- Login Form -->
    <div id="loginSection">
      <div class="card-header">
        <img src="logo.png" alt="Department Logo" style="width:100%;display:block;" />
      </div>

      <div style="padding: 24px 28px 0;">
      <div class="field">
        <label for="studentNumber">Student Number</label>
        <input
          type="text"
          id="studentNumber"
          placeholder="e.g. 100234"
          autocomplete="username"
          inputmode="numeric"
        />
      </div>

      <div class="field">
        <label for="passcode">Passcode</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="passcode"
            placeholder="Enter your passcode"
            autocomplete="current-password"
          />
          <button class="toggle-btn" id="toggleBtn" type="button" aria-label="Show passcode">
            <!-- Eye icon (shown when password is hidden) -->
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon (shown when password is visible) -->
            <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn" id="loginBtn" type="button">
        <span class="btn-text">Sign In</span>
        <div class="spinner"></div>
      </button>
      <p id="loginStatus" role="status" aria-live="polite" style="display:none;text-align:center;margin-top:10px;font-size:0.85rem;color:var(--text-muted);"></p>
      </div>
      <p id="notYouRow" style="display:none;text-align:center;margin-top:12px;font-size:0.82rem;color:#6b7aa0;">
        Signing in as <strong id="notYouName"></strong> &nbsp;·&nbsp;
        <a href="#" id="notYouLink" style="color:#3b6ef8;text-decoration:none;font-weight:600;">Not you?</a>
      </p>

      <div class="alert alert-error" id="errorAlert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText">Incorrect student number or passcode. Please try again.</span>
      </div>
    </div>

    <!-- Welcome State (shown after successful login) -->
    <div class="welcome-wrap" id="welcomeSection">
      <div class="logo" style="margin: 0 auto 20px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <p class="welcome-name">Hello, <span id="welcomeName"></span>!</p>
      <p class="welcome-sub">You're signed in successfully.</p>

      <!--
        ── DEVELOPER NOTE ──────────────────────────────────────────
        Replace the button below with whatever action should happen
        after login — e.g. redirect to your main site page:
          window.location.href = "dashboard.html";
        The student's info is in sessionStorage:
          sessionStorage.getItem("studentFirstName")
          sessionStorage.getItem("studentLastName")
          sessionStorage.getItem("studentNumber")
        ────────────────────────────────────────────────────────────
      -->
      <button class="btn" onclick="goToDashboard()">
        <span class="btn-text">Continue →</span>
      </button>
      <br/>
      <button class="btn-outline" onclick="signOut()">Sign out</button>
    </div>


  </div>

  <script>
    // ── CONFIGURATION ─────────────────────────────────────────
    // Paste your deployed Apps Script Web App URL here.
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_REo7dnRZo3fny_xv3uyhCUlImo4-4RM3x8W9Nu0JQHvBNv3HYRlzquLzm-PVCxzg/exec";
    // ──────────────────────────────────────────────────────────

    // ── localStorage credential keys ──────────────────────────────
    const LS_NUM     = 'brmll_studentNumber';
    const LS_CODE    = 'brmll_passcode';
    const LS_NAME    = 'brmll_firstName';
    const LS_PROFILE = 'brmll_profile';   // saved roster info for instant sign-in

    // ── Login tuning ──────────────────────────────────────────────
    const REQUEST_TIMEOUT_MS   = 12000;          // give up on a single request after 12 s
    const RETRY_DELAYS_MS      = [2000, 4000];   // up to 2 automatic retries (timeouts retry once)
    const SLOW_NOTICE_MS       = 3000;           // show "this can take a few seconds" after 3 s
    const FAST_SIGNIN_DELAY_MS = 1500;           // window to click "Not you?" before instant sign-in
    const PROFILE_MAX_AGE_MS   = 7 * 24 * 60 * 60 * 1000; // re-check with the server at least weekly

    const ERROR_MESSAGES = {
      // Server answered with a known result
      invalid_credentials: "Incorrect student number or passcode. Please try again.",
      locked_out:          "Too many failed attempts. Please wait 15 minutes or ask your teacher to unlock your account.",
      missing_fields:      "Please enter both your student number and passcode.",
      server_error:        "The login server had a problem. Please wait a moment and try again.",
      // Request never got a usable answer
      offline:  "Your device appears to be offline. Check your Wi-Fi and try again.",
      timeout:  "The login server is taking too long (lots of students may be signing in at once). Please wait a moment and try again.",
      network:  "Couldn't reach the login server. Please try again — if it keeps happening, tell your teacher.",
      server:   "The login server is busy right now. Please wait a moment and try again."
    };

    const loginBtn      = document.getElementById("loginBtn");
    const errorAlert    = document.getElementById("errorAlert");
    const errorText     = document.getElementById("errorText");
    const loginStatus   = document.getElementById("loginStatus");
    const loginSection  = document.getElementById("loginSection");
    const welcomeSection= document.getElementById("welcomeSection");
    const welcomeName   = document.getElementById("welcomeName");
    const toggleBtn     = document.getElementById("toggleBtn");
    const passcodeInput = document.getElementById("passcode");
    const eyeIcon       = document.getElementById("eyeIcon");
    const eyeOffIcon    = document.getElementById("eyeOffIcon");

    let loginInFlight    = false;  // blocks duplicate submits (click + Enter + auto-login)
    let fastSigninTimer  = null;

    // Show/hide passcode toggle
    toggleBtn.addEventListener("click", () => {
      const isHidden = passcodeInput.type === "password";
      passcodeInput.type = isHidden ? "text" : "password";
      eyeIcon.style.display    = isHidden ? "none"  : "block";
      eyeOffIcon.style.display = isHidden ? "block" : "none";
    });

    // Allow Enter key to submit (handleLogin ignores it if a login is already running)
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && loginSection.style.display !== "none") handleLogin();
    });

    // ── Network helpers ────────────────────────────────────────
    class LoginError extends Error {
      constructor(kind, detail) { super(detail || kind); this.kind = kind; }
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    /** One request to Apps Script, with a timeout. Throws LoginError on any failure. */
    async function postOnce(payload) {
      const ctrl  = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" }, // avoids CORS preflight with Apps Script
          body: JSON.stringify(payload),
          redirect: "follow",
          signal: ctrl.signal
        });
        if (!response.ok) throw new LoginError("server", "HTTP " + response.status);
        const text = await response.text();
        try {
          return JSON.parse(text);
        } catch (_) {
          // Apps Script sends an HTML page (e.g. "Service invoked too many times") instead of JSON
          throw new LoginError("server", "Non-JSON response: " + text.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 300));
        }
      } catch (err) {
        if (err instanceof LoginError) throw err;
        if (err.name === "AbortError") throw new LoginError("timeout", "No response after " + REQUEST_TIMEOUT_MS + " ms");
        throw new LoginError(navigator.onLine === false ? "offline" : "network", err.message);
      } finally {
        clearTimeout(timer);
      }
    }

    /** postOnce with automatic retries for temporary failures. */
    async function postWithRetry(payload, onRetry) {
      let timeoutsSeen = 0;
      for (let attempt = 0; ; attempt++) {
        const canRetry = attempt < RETRY_DELAYS_MS.length;
        // Random ±25% spread so a whole class doesn't retry at the same instant
        const delay = canRetry ? RETRY_DELAYS_MS[attempt] * (0.75 + Math.random() * 0.5) : 0;
        try {
          const data = await postOnce(payload);
          if (data && data.success === false && data.error === "server_error" && canRetry) {
            console.warn(`[login] attempt ${attempt + 1}: server_error —`, data.detail);
            onRetry(); await sleep(delay); continue;
          }
          return data;
        } catch (err) {
          console.error(`[login] attempt ${attempt + 1} failed (${err.kind}):`, err.message);
          if (err.kind === "timeout") timeoutsSeen++;
          if (!canRetry || err.kind === "offline" || timeoutsSeen > 1) throw err;
          onRetry(); await sleep(delay);
        }
      }
    }

    // ── Session helpers ────────────────────────────────────────
    function startSession(studentNumber, p) {
      sessionStorage.setItem("studentFirstName",  p.firstName);
      sessionStorage.setItem("studentLastName",   p.lastName);
      sessionStorage.setItem("studentNumber",     studentNumber);
      sessionStorage.setItem("studentGrade",      p.grade);
      sessionStorage.setItem("studentClass",      p.class);
      sessionStorage.setItem("studentInstrument", p.instrument || "Violin");
    }

    function saveCredentials(studentNumber, passcode, p) {
      localStorage.setItem(LS_NUM,  studentNumber);
      localStorage.setItem(LS_CODE, passcode);
      localStorage.setItem(LS_NAME, p.firstName);
      localStorage.setItem(LS_PROFILE, JSON.stringify({
        studentNumber, firstName: p.firstName, lastName: p.lastName, grade: p.grade,
        class: p.class, instrument: p.instrument, savedAt: Date.now()
      }));
    }

    function clearCredentials() {
      [LS_NUM, LS_CODE, LS_NAME, LS_PROFILE].forEach(k => localStorage.removeItem(k));
      document.getElementById('notYouRow').style.display = 'none';
    }

    /** Saved profile for this student number, if recent enough to trust without the server. */
    function readSavedProfile(studentNumber) {
      try {
        const p = JSON.parse(localStorage.getItem(LS_PROFILE) || "null");
        if (!p || p.studentNumber !== studentNumber) return null;
        if (!p.savedAt || Date.now() - p.savedAt > PROFILE_MAX_AGE_MS) return null;
        return p;
      } catch (_) { return null; }
    }

    function cancelFastSignin() {
      if (fastSigninTimer) { clearTimeout(fastSigninTimer); fastSigninTimer = null; setLoading(false); }
    }

    // ── Login Handler ──────────────────────────────────────────
    async function handleLogin() {
      if (loginInFlight) return;          // already signing in — ignore extra clicks / Enter presses
      cancelFastSignin();

      const studentNumber = document.getElementById("studentNumber").value.trim();
      const passcode      = passcodeInput.value.trim();

      hideError();

      if (!studentNumber || !passcode) {
        showError(ERROR_MESSAGES.missing_fields);
        return;
      }

      loginInFlight = true;
      setLoading(true);
      let redirecting = false;
      const slowTimer = setTimeout(() => showStatus("Signing in… this can take a few seconds."), SLOW_NOTICE_MS);

      try {
        const data = await postWithRetry(
          { action: "login", studentNumber, passcode },
          () => showStatus("Still working on it — trying again…")
        );

        if (data.success) {
          startSession(studentNumber, data);
          saveCredentials(studentNumber, passcode, data);
          redirecting = true;
          window.location.href = "dashboard.html";
        } else {
          // Saved credentials are wrong now (e.g. passcode changed) — forget them
          if (data.error === "invalid_credentials" && localStorage.getItem(LS_NUM)) clearCredentials();
          showError(ERROR_MESSAGES[data.error] || ERROR_MESSAGES.server_error);
        }

      } catch (err) {
        showError(ERROR_MESSAGES[err.kind] || ERROR_MESSAGES.network);
      } finally {
        clearTimeout(slowTimer);
        if (!redirecting) {
          hideStatus();
          loginInFlight = false;
          setLoading(false);
        }
      }
    }

    loginBtn.addEventListener("click", handleLogin);

    // ── "Not you?" handler ──────────────────────────────────────
    document.getElementById('notYouLink').addEventListener('click', e => {
      e.preventDefault();
      cancelFastSignin();
      hideStatus();
      clearCredentials();
      document.getElementById('studentNumber').value = '';
      passcodeInput.value = '';
    });

    // ── Auto-login from localStorage on page load ───────────────
    (function tryAutoLogin() {
      const savedNum  = localStorage.getItem(LS_NUM);
      const savedCode = localStorage.getItem(LS_CODE);
      const savedName = localStorage.getItem(LS_NAME);
      if (!savedNum || !savedCode) return;

      // Show who we're about to sign in as
      document.getElementById('studentNumber').value = savedNum;
      passcodeInput.value = savedCode;
      if (savedName) {
        document.getElementById('notYouName').textContent = savedName;
        document.getElementById('notYouRow').style.display = 'block';
      }

      // Fast path: we already have this student's info from a recent login —
      // skip the server entirely so returning students don't join the login rush.
      const profile = readSavedProfile(savedNum);
      if (profile) {
        setLoading(true);
        fastSigninTimer = setTimeout(() => {
          fastSigninTimer = null;
          startSession(savedNum, profile);
          window.location.href = "dashboard.html";
        }, FAST_SIGNIN_DELAY_MS);
        return;
      }

      // No recent profile (first time on this device, or older than a week) — check with the server
      handleLogin();
    })();

    // ── Helpers ────────────────────────────────────────────────
    function setLoading(on) {
      loginBtn.disabled = on;
      loginBtn.classList.toggle("loading", on);
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorAlert.classList.add("show");
    }

    function hideError() {
      errorAlert.classList.remove("show");
    }

    function showStatus(msg) {
      loginStatus.textContent = msg;
      loginStatus.style.display = "block";
    }

    function hideStatus() {
      loginStatus.style.display = "none";
    }

    function signOut() {
      sessionStorage.clear();
      welcomeSection.classList.remove("show");
      loginSection.style.display = "block";
      document.getElementById("studentNumber").value = "";
      passcodeInput.value = "";
    }

    // Replace this with your actual post-login destination
    function goToDashboard() {
      window.location.href = "dashboard.html";
    }

    // ── Auto-login if already signed in this session ───────────
    window.addEventListener("DOMContentLoaded", () => {
      const firstName = sessionStorage.getItem("studentFirstName");
      if (firstName) {
        welcomeName.textContent = firstName;
        loginSection.style.display  = "none";
        welcomeSection.classList.add("show");
      }
    });
  </script>
</body>
</html>
