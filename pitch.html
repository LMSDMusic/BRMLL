<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note ID</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #f0f4ff;
    --surface:    #ffffff;
    --blue:       #3b6ef8;
    --blue-dark:  #2a5ce0;
    --blue-light: #e8effe;
    --text:       #1a1f36;
    --muted:      #6b7280;
    --border:     #dde3f0;
    --green:      #2f855a;
    --red:        #c53030;
    --cream:      #f0f4ff;
    --parchment:  #dde3f0;
    --navy:       #1a1f36;
    --navy-mid:   #2a5ce0;
    --gold:       #3b6ef8;
    --gold-light: #e8effe;
    /* Ensemble themes */
    --orch-bg:     #f0ecf8;
    --orch-border: #c9bce8;
    --orch-icon:   #6b4faa;
    --orch-hover:  #e6dff5;
    --band-bg:     #fdf4e3;
    --band-border: #e8d099;
    --band-icon:   #a07820;
    --band-hover:  #faefd4;
    /* Instrument colors */
    --violin-color: #a33030;
    --viola-color:  #2a7a6a;
    --cello-color:  #b06a10;
    --bass-color:   #1a5c7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--cream);
    background-image: repeating-linear-gradient(transparent, transparent 39px, #c8c0b0 39px, #c8c0b0 40px);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    padding: 20px;
  }

  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(26,39,68,0.15), 0 2px 8px rgba(26,39,68,0.08);
    max-width: 580px;
    width: 100%;
    overflow: hidden;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── HEADER ── */
  .header {
    background: var(--navy);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    color: white;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  .header h1 span {
    display: block;
    font-size: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .key-badge {
    background: var(--gold);
    color: var(--navy);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── PROGRESS ── */
  .progress-bar-wrap { background: var(--parchment); height: 6px; }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width 0.5s ease;
  }

  /* ── QUIZ BODY ── */
  .body { padding: 28px; }
  .question-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem; color: var(--navy); margin-bottom: 20px;
  }
  .staff-container {
    background: var(--cream);
    border: 2px solid var(--parchment);
    border-radius: 12px;
    padding: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px; min-height: 210px;
  }
  .staff-img { height: 180px; object-fit: contain; display: block; }

  .answers-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 20px;
  }
  /* 7-option layout (Q1/Q2): 4+3 */
  .answers-grid.opts-7 .answer-btn:nth-child(5) { grid-column: 1; }
  .answers-grid.opts-7 .answer-btn:nth-child(6) { grid-column: 2; }
  .answers-grid.opts-7 .answer-btn:nth-child(7) { grid-column: 3; }
  /* 9-option layout (Q3/Q4): 4 columns, C and F notes paired */
  .answers-grid.opts-9 { grid-template-columns: repeat(4, 1fr); }
  /* Pair cell: two small stacked buttons sharing one grid column */
  .btn-pair {
    display: flex;
    flex-direction: row;
    gap: 5px;
  }
  .btn-pair .answer-btn {
    padding: 14px 2px;
    font-size: 0.78rem;
    flex: 1;
    min-width: 0;
  }

  /* Fingering layout: all buttons in one row, compact */
  .answers-grid.opts-finger {
    grid-template-columns: repeat(var(--finger-cols), 1fr);
    gap: 6px;
  }
  .answers-grid.opts-finger .answer-btn {
    padding: 10px 4px;
    font-size: 0.78rem;
  }

  .answer-btn {
    background: var(--parchment);
    border: 2px solid transparent;
    border-radius: 10px; padding: 14px 8px;
    font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
    color: var(--navy); cursor: pointer; transition: all 0.18s ease; text-align: center;
  }
  .answer-btn:hover:not(:disabled) {
    background: var(--navy); color: white; border-color: var(--navy);
    transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,39,68,0.2);
  }
  .answer-btn.correct        { background: var(--green); color: white; border-color: var(--green); }
  .answer-btn.wrong          { background: var(--red);   color: white; border-color: var(--red); }
  .answer-btn.reveal-correct { background: var(--green); color: white; border-color: var(--green); opacity: 0.7; }
  .answer-btn:disabled       { cursor: default; transform: none; }

  .feedback {
    min-height: 36px; font-size: 1.1rem; font-weight: 700;
    text-align: center; margin-bottom: 4px; line-height: 36px;
  }
  .feedback.correct { color: var(--green); }
  .feedback.wrong   { color: var(--red); }

  /* ── SCORE SCREEN ── */
  .score-screen { padding: 36px 28px; text-align: center; animation: slideUp 0.4s ease; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%; background: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0 auto 24px; box-shadow: 0 8px 24px rgba(26,39,68,0.3);
  }
  .score-num   { font-family: 'DM Serif Display', serif; font-size: 2.2rem; color: var(--gold-light); line-height: 1; }
  .score-denom { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .score-title { font-family: 'DM Serif Display', serif; font-size: 1.7rem; color: var(--navy); margin-bottom: 8px; }
  .score-sub   { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5; }
  .results-list {
    text-align: left; background: var(--cream); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; max-height: 240px; overflow-y: auto;
  }
  .result-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--parchment); font-size: 0.9rem;
  }
  .result-item:last-child { border-bottom: none; }
  .q-label { color: var(--muted); font-size: 0.8rem; }
  .r-note  { font-weight: 600; color: var(--navy); }
  .r-icon  { font-size: 1rem; }

  .score-btn-row { display: flex; gap: 10px; }
  .score-time { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; letter-spacing: 0.02em; }
  .replay-btn {
    flex: 1; padding: 14px; background: var(--gold); color: var(--navy);
    border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
  }
  .replay-btn:hover { background: var(--gold-light); }
  .score-next-btn { flex:1; padding:14px; border-radius:10px; border:none; background:var(--blue); font-family:DM Sans,sans-serif; font-size:1rem; font-weight:700; color:#fff; cursor:pointer; transition:background .15s; }
  .score-next-btn:hover { background:var(--blue-dark); }
  .score-menu-btn { width:100%; padding:12px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); font-family:DM Sans,sans-serif; font-size:0.9rem; font-weight:600; color:var(--text); cursor:pointer; transition:all .15s; }
  .score-menu-btn:hover { border-color:var(--blue); color:var(--blue); }
  /* ── SUBMISSION PANEL ── */
  .chor      { --ens-color: #6a3d9a; }
  .chor-inst { --inst-color: #6a3d9a; }
  .band-inst { --inst-color: #c75000; --inst-light: #fff3ed; }
  .submit-status {
    text-align: center; font-size: 0.9rem; font-weight: 600;
    min-height: 22px; margin-bottom: 8px;
  }
  .submit-status.success { color: var(--green); }
  .submit-status.error   { color: var(--red); }

  /* ── Rhythm-style quiz chrome ── */
  .pitch-game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 1rem;
    padding: 12px 16px 0;
  }
  .pitch-lvl-badge {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .pitch-dots {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .pitch-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--border);
    border: 1.5px solid #dde3f0;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .pitch-dot.current { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,110,248,0.15); }
  .pitch-dot.correct  { background: var(--green); border-color: var(--green); }
  .pitch-dot.wrong    { background: var(--red);   border-color: var(--red); }
  .pitch-q-counter {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  .pitch-nav-btns {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.75rem;
  }
  .pitch-nav-btn {
    background: none;
    border: 1.5px solid var(--blue);
    color: var(--blue);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.35rem 1rem;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.15s, color 0.15s;
  }
  .pitch-nav-btn:hover { background: var(--blue); color: white; }
  .pitch-submit-status {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    min-height: 1rem;
    margin-top: 0.4rem;
  }
</style>
</head>

function buildQ3NoteQuiz(pool) {
  var sh = pool.slice();
  for (var i = sh.length-1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i+1));
    var t = sh[i]; sh[i] = sh[j]; sh[j] = t;
  }
  return sh;
}

// ── FINGERING QUIZ BUILDERS ───────────────────────────────────────
// buildFixedFingeringQuiz: for single-key quarters (Q1, Q2)
// fingerByFile: { 'images/note5.png': '0', ... }
function buildFixedFingeringQuiz(pool, fingerByFile, stringByFile) {
  const shuffled = [...pool];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.map(note => ({
    noteFile:     note.noteFile,
    answer:       fingerByFile[note.noteFile],
    answerString: stringByFile ? stringByFile[note.noteFile] : undefined,
    label:        note.label,
  }));
}

function getFolder(id) { return FOLDERS.find(f => f.id === id); }

const DEFAULT_TOTAL = 12;

function totalQ() {
  const t = (activeQuiz && activeQuiz.totalQuestions) || DEFAULT_TOTAL;
  // Safeguard: never ask more questions than the quiz actually built,
  // otherwise the quiz stalls when it runs out of notes.
  return (questions && questions.length) ? Math.min(t, questions.length) : t;
}

// ── STATE ────────────────────────────────────────────────────────
let activeEnsemble = null;
let activeGrade    = null;
let activeInstrument = null;
let activeFolder = null;
let activeQuiz   = null;
let questions    = [];
let currentQ     = 0;
let score        = 0;
let answered     = false;
let results      = [];
let quizStartTime = null;
let elapsed = '';

// ── HELPERS ──────────────────────────────────────────────────────
function buildRandomQuiz(pool) {
  // Fisher-Yates shuffle — every note appears exactly once, no repeats
  const shuffled = [...pool];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function getMessage(sc, total) {
  const pct = sc / total;
  if (pct === 1)   return "Perfect score! Outstanding musicianship! 🎶";
  if (pct >= 0.75) return "Great work! You're reading notes well.";
  if (pct >= 0.5)  return "Good effort! Keep practicing the staff.";
  return "Keep practicing — you'll get there! 🎵";
}

function formatTime(ms) {
  const totalSec = Math.round(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  if (m === 0) return `${s}s`;
  return `${m}m ${s.toString().padStart(2, '0')}s`;
}
function nextQuestion() {
  currentQ++;
  answered = false;
  currentQ < totalQ() ? renderQuestion() : renderScore();
}

// ── LAUNCH QUIZ ───────────────────────────────────────────────────
function launchQuiz(folderId, quizId) {
  startQuiz(folderId, quizId);
}

// ── SCREEN: QUIZ QUESTION ────────────────────────────────────────
function startQuiz(folderId, quizId) {
  activeFolder = getFolder(folderId);
  activeQuiz   = activeFolder.quizzes.find(q => q.id === quizId);
  questions    = activeQuiz.buildQuiz ? activeQuiz.buildQuiz() : buildRandomQuiz(activeQuiz.notePool);
  currentQ     = 0;
  score        = 0;
  answered     = false;
  results      = [];
  quizStartTime = Date.now();
  renderQuestion();
}

// ── NOTE FINGERBOARD SVG ─────────────────────────────────────────
// Same layout as fingering fingerboard but buttons show note names.
// Enharmonic pairs (btn.notes = ['F','F#']) render as two small stacked circles.
function buildNoteFingerboardSVG(fb) {
  const R    = 18;
  const HALF = R * 2 + 8 + R;
  const LABEL_X  = 20;
  const OPEN_X   = 70;
  const NUT_X    = OPEN_X + R + 16;
  const FRET1_X  = NUT_X + HALF;
  const maxSemis = fb.maxSemis || 6;
  const LINE_END = FRET1_X + maxSemis * HALF + R + 20;
  const SVG_W    = LINE_END + 20;
  const lastStr  = fb.strings[fb.strings.length - 1];
  const SVG_H    = lastStr.y + 35;

  function btnX(semi) {
    return semi === 0 ? OPEN_X : FRET1_X + (semi - 1) * HALF;
  }

  const ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    const e = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }
  function txtEl(content, x, y, attrs) {
    const e = el('text', Object.assign({x, y}, attrs));
    e.textContent = content;
    return e;
  }

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const nutColor    = isDark ? '#B4B2A9' : '#444441';
  const labelColor  = isDark ? '#B4B2A9' : '#2C2C2A';
  const stringColor = isDark ? '#888780' : '#888780';
  const activeBg    = isDark ? '#CECBF6' : '#EEEDFE';
  const activeStroke= isDark ? '#3C3489' : '#7F77DD';
  const activeTxt   = isDark ? '#3C3489' : '#534AB7';

  const svg = el('svg', {
    viewBox: '0 0 ' + SVG_W + ' ' + SVG_H,
    xmlns: ns,
    style: 'width:100%;height:220px;display:block;',
    id: 'note-fingerboard-svg',
  });

  // Nut
  const nutTop = fb.strings[0].y - 16;
  const nutBot = lastStr.y + 16;
  svg.appendChild(el('rect', {x: NUT_X - 4, y: nutTop, width: 8, height: nutBot - nutTop, rx: 2, fill: nutColor}));

  fb.strings.forEach(function(str) {
    svg.appendChild(el('line', {x1: NUT_X, y1: str.y, x2: LINE_END, y2: str.y, stroke: stringColor, 'stroke-width': 1.5}));
    svg.appendChild(txtEl(str.name, LABEL_X, str.y + 6, {'text-anchor': 'middle', 'font-size': '15', 'font-weight': '500', fill: labelColor}));

    str.buttons.forEach(function(btn) {
      const cx = btnX(btn.semi);
      const note = btn.note;
      const isLong = note.length > 1;
      const g = el('g', {'class': 'nfb-btn', 'data-value': note, style: 'cursor:pointer'});
      g.appendChild(el('circle', {cx, cy: str.y, r: R, fill: activeBg, stroke: activeStroke, 'stroke-width': 1.5}));
      g.appendChild(txtEl(note, cx, str.y + (isLong ? 4 : 6), {
        'text-anchor': 'middle', 'font-size': isLong ? '11' : '18', 'font-weight': '700', fill: activeTxt,
        style: 'pointer-events:none',
      }));
      const sName = str.name;
      g.setAttribute('data-string', sName);
      g.addEventListener('click', function() { selectAnswer(note, g, sName); });
      svg.appendChild(g);
    });
  });

  return svg;
}

function renderNoteFingerboard(fb) {
  const grid = document.getElementById('answers-grid');
  if (!grid) return;
  grid.innerHTML = '';
  grid.className = 'answers-grid fingerboard-grid';
  grid.style.cssText = 'display:block;width:100%;margin-bottom:20px;';
  grid.appendChild(buildNoteFingerboardSVG(fb));
}

function selectAnswer(chosen, btn, chosenString) {
  if (answered) return;
  answered = true;

  const q = questions[currentQ];
  // If question has answerString, both finger AND string must match
  const correctFinger = chosen === q.answer;
  const correctString = !q.answerString || chosenString === q.answerString;
  const correct = correctFinger && correctString;
  if (correct) score++;
  results.push({ label: q.label, keyLabel: q.keyLabel || null, chosen, chosenString: chosenString || null, correct, correctAnswer: q.answer, correctString: q.answerString || null });

  // Handle SVG fb-btn, nfb-btn, and regular answer-btn
  const isFb  = btn && btn.classList.contains('fb-btn');
  const isNfb = btn && btn.classList.contains('nfb-btn');
  if (isFb || isNfb) {
    const btnClass = isFb ? '.fb-btn' : '.nfb-btn';
    document.querySelectorAll(btnClass).forEach(function(b) {
      b.style.pointerEvents = 'none';
      if (!correct && b.dataset.value === q.answer && (!isFb || b.dataset.string === q.answerString)) {
        b.querySelector('circle').setAttribute('fill', '#1D9E75');
        b.querySelector('circle').setAttribute('stroke', '#0F6E56');
        b.querySelectorAll('text').forEach(function(t) { t.setAttribute('fill', '#fff'); });
      }
    });
    const circ = btn.querySelector('circle');
    const txts = btn.querySelectorAll('text');
    if (correct) {
      circ.setAttribute('fill', '#1D9E75'); circ.setAttribute('stroke', '#0F6E56');
      txts.forEach(function(t) { t.setAttribute('fill', '#fff'); });
    } else {
      circ.setAttribute('fill', '#E24B4A'); circ.setAttribute('stroke', '#A32D2D');
      txts.forEach(function(t) { t.setAttribute('fill', '#fff'); });
    }
  } else {
    document.querySelectorAll('.answer-btn').forEach(function(b) {
      b.disabled = true;
      if (b.dataset && b.dataset.value === q.answer && !correct) b.classList.add('reveal-correct');
    });
    if (correct) { btn.classList.add('correct'); } else { btn.classList.add('wrong'); }
  }

  if (correct) {
    document.getElementById('feedback').textContent = '✓ Correct!';
    document.getElementById('feedback').className = 'feedback correct';
  } else {
    const stringHint = q.answerString ? ' on the ' + q.answerString + ' string' : '';
    document.getElementById('feedback').textContent = '✗ The correct answer is ' + q.answer + stringHint + '.';
    document.getElementById('feedback').className = 'feedback wrong';
  }

  setTimeout(nextQuestion, correct ? 1000 : 2000);
}

function buildAnswerButtons(opts) {
  // Detect pairs: any letter appearing as both flat+natural or natural+sharp
  // renders as a half-size btn-pair. Works for any option count.
  const NOTE_ORDER = ['A♭','A','B♭','B','C','C#','D','E♭','E','F','F#','G'];

  // Group variants by letter
  const letterMap = {};
  opts.forEach(function(n) {
    var letter = n.replace(/[♭#]/g, '');
    if (!letterMap[letter]) letterMap[letter] = [];
    letterMap[letter].push(n);
  });

  // If no opts appear in NOTE_ORDER (e.g. fingering: '0','1','Low 2'), render as-is
  var isNoteQuiz = opts.some(function(n) { return NOTE_ORDER.includes(n); });
  if (!isNoteQuiz) {
    return opts.map(function(n) {
      return '<button class="answer-btn" data-value="' + n + '" onclick="selectAnswer(\'' + n + '\', this)">' + n + '</button>';
    }).join('');
  }

  // Build ordered slots, collapsing pairs into one slot
  var seen = {};
  var slots = [];
  NOTE_ORDER.forEach(function(n) {
    if (!opts.includes(n)) return;
    var letter = n.replace(/[♭#]/g, '');
    if (seen[letter]) return;
    seen[letter] = true;
    slots.push(letterMap[letter]);
  });

  return slots.map(function(variants) {
    if (variants.length === 1) {
      var n = variants[0];
      return '<button class="answer-btn" data-value="' + n + '" onclick="selectAnswer(\'' + n + '\', this)">' + displayNote(n) + '</button>';
    }
    // Sort: flat first, then natural, then sharp
    var sorted = variants.slice().sort(function(a, b) {
      if (a.includes('♭')) return -1;
      if (b.includes('♭')) return 1;
      if (b.includes('#')) return -1;
      return 1;
    });
    return '<div class="btn-pair">' + sorted.map(function(n) {
      return '<button class="answer-btn" data-value="' + n + '" onclick="selectAnswer(\'' + n + '\', this)">' + displayNote(n) + '</button>';
    }).join('') + '</div>';
  }).join('');
}

function renderQuestion() {
  const q        = questions[currentQ];
  const progress = (currentQ / totalQ()) * 100;
  const clefImg   = q.clefImg   || activeQuiz.clefImg;
  const clefLabel = q.clefLabel || activeQuiz.clefLabel;
  const opts      = activeQuiz.noteOptions;
  const fb        = activeQuiz.fingerboard || null;
  const nfb       = activeQuiz.noteFingerboard || null;
  const isFingerGrid = !fb && !nfb && opts.some(function(o) { return ['0','1','2','3','4','Low 1','Low 2','Shift 1','Shift 2','Shift 4'].includes(o); });
  const gridClass = (fb || nfb)
    ? 'answers-grid fingerboard-grid'
    : isFingerGrid
      ? 'answers-grid opts-finger'
      : opts.length === 9 ? 'answers-grid opts-9' : 'answers-grid opts-7';

  // Build progress dots HTML
  function buildDots() {
    return Array.from({ length: totalQ() }, function(_, i) {
      let cls = 'pitch-dot';
      if (i < currentQ) cls += ' correct'; // simplified — could track wrong answers
      else if (i === currentQ) cls += ' current';
      return '<span class="' + cls + '"></span>';
    }).join('');
  }

  // First question: build full HTML
  if (currentQ === 0 || !document.getElementById('staff-clef')) {
    const levelStr = getCurrentLevel() > 0 ? getCurrentLevel().toFixed(1) : '';
    document.getElementById('app').innerHTML = `
      <div class="pitch-game-header">
        <span class="pitch-lvl-badge" id="pitch-lvl-badge">${levelStr ? 'Level ' + levelStr : ''}</span>
        <div class="pitch-dots" id="pitch-dots">${buildDots()}</div>
        <span class="pitch-q-counter" id="pitch-q-counter">${currentQ + 1} of ${totalQ()}</span>
      </div>

      <div class="body">
        <div class="question-text">${activeQuiz.questionText || 'What note is shown on the staff?'}</div>

        <div class="staff-container">
          <img src="${clefImg}" id="staff-clef" class="staff-img" alt="Clef" />
          <img src="${q.noteFile}" id="staff-note" class="staff-img" alt="Note on staff" />
        </div>

        <div class="${gridClass}" id="answers-grid" style="${isFingerGrid ? '--finger-cols:' + opts.length : ''}">
          ${(fb || nfb) ? '' : buildAnswerButtons(opts)}
        </div>

        <div class="feedback" id="feedback"></div>
      </div>

      <div class="pitch-nav-btns">
        <button class="pitch-nav-btn" onclick="startQuiz(activeFolder.id, activeQuiz.id)">Restart</button>
        <button class="pitch-nav-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
      </div>
      <div class="pitch-submit-status" id="submit-status"></div>
    `;
    if (fb) renderFingerboard(fb);
    else if (nfb) renderNoteFingerboard(nfb);
    return;
  }

  // Subsequent questions: update only what changes, leaving clef img in place
  const dotsEl = document.getElementById('pitch-dots');
  if (dotsEl) dotsEl.innerHTML = buildDots();
  const counterEl = document.getElementById('pitch-q-counter');
  if (counterEl) counterEl.textContent = (currentQ + 1) + ' of ' + totalQ();
  document.getElementById('feedback').textContent       = '';
  document.getElementById('feedback').className         = 'feedback';

  // Only update clef src if it actually changed (prevents flicker on same-key questions)
  const clefEl = document.getElementById('staff-clef');
  if (clefEl.src !== clefImg && !clefEl.src.endsWith('/' + clefImg)) {
    clefEl.src = clefImg;
  }
  document.getElementById('staff-note').src = q.noteFile;

  const grid = document.getElementById('answers-grid');
  grid.className = gridClass;
  if (fb) {
    renderFingerboard(fb);
  } else if (nfb) {
    renderNoteFingerboard(nfb);
  } else {
    if (isFingerGrid) grid.style.setProperty('--finger-cols', opts.length);
    grid.innerHTML = buildAnswerButtons(opts);
  }
}

// ── SCREEN: SCORE ────────────────────────────────────────────────
// Returns note label with accidental applied based on key signature
// e.g. noteWithKey('F4', 'G Major') → 'F#4'
//      noteWithKey('C5', 'D Major') → 'C#5'
//      noteWithKey('B3', 'G Major') → 'B3'
// keyLabel may be a full key name ('D Major') or null — if null, falls back
// to extracting the key from activeQuiz.clefLabel ('Treble Clef · D Major')
function noteWithKey(label, keyLabel) {
  // Resolve key name: use per-question keyLabel, or extract from quiz clefLabel
  let keyName = keyLabel;
  if (!keyName && activeQuiz && activeQuiz.clefLabel) {
    const parts = activeQuiz.clefLabel.split('·');
    keyName = parts[parts.length - 1].trim();
  }
  if (!keyName) return label;
  const keyEntry = Object.values(KEYS).find(k => k.label === keyName);
  if (!keyEntry) return label;
  const match = label.match(/^([A-G])(\d)$/);
  if (!match) return label;
  const noteLetter = match[1];
  const octave     = match[2];
  if (keyEntry.sharps.includes(noteLetter)) return noteLetter + '#' + octave;
  if (keyEntry.flats.includes(noteLetter))  return noteLetter + '♭' + octave;
  return label;
}

async function autoSubmitScore() {
  if (_teacherMode) return; // never log teacher/class sessions
  const studentNumber = sessionStorage.getItem('studentNumber');
  if (!studentNumber) return;

  const levelVal  = getCurrentLevel();
  const pct       = totalQ() > 0 ? Math.round(score / totalQ() * 100) : 0;
  const totalSec  = elapsed ? (function() {
    const m = elapsed.match(/(?:(\d+)m\s*)?(\d+)s/);
    return m ? parseInt(m[1] || 0) * 60 + parseInt(m[2]) : 0;
  })() : 0;
  const missedList = results
    .filter(r => !r.correct)
    .map(r => r.label + (r.keyLabel ? ' (' + r.keyLabel + ')' : ''))
    .join(',') || '';

  const el = document.getElementById('submit-status');
  if (el) el.textContent = 'Saving…';

  try {
    const res = await fetch(SCRIPT_URL, {
      method:   'POST',
      headers:  { 'Content-Type': 'text/plain' },
      body:     JSON.stringify({
        action:          'logAttempt',
        studentNumber,
        moduleId:        'note_id',
        level:           levelVal,
        score:           score,
        percent:         pct,
        durationSeconds: totalSec,
        missedItems:     missedList
      }),
      redirect: 'follow'
    });
    const data = await res.json();
    if (el) el.textContent = data.success ? '✓ Score saved' : '✗ Save failed';
  } catch(e) {
    if (el) el.textContent = '✗ Save failed';
  }
}

function getNextLevelUrl() {
  // Next level in this instrument's sequence (orchestra or band)
  const instr    = getStudentInstrument();
  const seq      = levelSequenceFor(instr);
  const curLevel = getCurrentLevel();
  const idx      = seq.findIndex(function(e) { return Math.abs(e.level - curLevel) < 0.01; });
  if (idx === -1) return null;
  // Skip any level whose quiz isn't built yet for this instrument
  for (var next = idx + 1; next < seq.length; next++) {
    if (getLevelQuiz(seq[next], instr)) return 'pitch.html?level=' + seq[next].level.toFixed(1);
  }
  return null;
}

  return totalQ() > 0 && Math.round(score / totalQ() * 100) >= PITCH_PASS_PCT;

// ── LEVEL SEQUENCE ───────────────────────────────────────────────────────────
// Defines the ordered progression of quizzes mapped to decimal levels.
// LEVEL_SEQUENCE is the orchestra sequence (notes + fingering per quarter).
// Band uses BAND_LEVEL_SEQUENCE (notes only, one level per quarter).
// Both must match pitchLevelOrder() in dashboard.html.
const LEVEL_SEQUENCE = [
  { level: 5.1, grade: '5th', quarter: 'q1', type: 'notes',     label: '5th Grade · Q1 · Notes' },
  { level: 5.2, grade: '5th', quarter: 'q1', type: 'fingering', label: '5th Grade · Q1 · Fingering', orchOnly: true },
  { level: 5.3, grade: '5th', quarter: 'q2', type: 'notes',     label: '5th Grade · Q2 · Notes' },
  { level: 5.4, grade: '5th', quarter: 'q2', type: 'fingering', label: '5th Grade · Q2 · Fingering', orchOnly: true },
  { level: 5.5, grade: '5th', quarter: 'q3', type: 'notes',     label: '5th Grade · Q3 · Notes' },
  { level: 5.6, grade: '5th', quarter: 'q3', type: 'fingering', label: '5th Grade · Q3 · Fingering', orchOnly: true },
  { level: 5.7, grade: '5th', quarter: 'q4', type: 'notes',     label: '5th Grade · Q4 · Notes' },
  { level: 5.8, grade: '5th', quarter: 'q4', type: 'fingering', label: '5th Grade · Q4 · Fingering', orchOnly: true },
  { level: 6.1, grade: '6th', quarter: 'q1', type: 'notes',     label: '6th Grade · Q1 · Notes' },
  { level: 6.2, grade: '6th', quarter: 'q1', type: 'fingering', label: '6th Grade · Q1 · Fingering', orchOnly: true },
  { level: 6.3, grade: '6th', quarter: 'q2', type: 'notes',     label: '6th Grade · Q2 · Notes' },
  { level: 6.4, grade: '6th', quarter: 'q2', type: 'fingering', label: '6th Grade · Q2 · Fingering', orchOnly: true },
  { level: 6.5, grade: '6th', quarter: 'q3', type: 'notes',     label: '6th Grade · Q3 · Notes' },
  { level: 6.6, grade: '6th', quarter: 'q3', type: 'fingering', label: '6th Grade · Q3 · Fingering', orchOnly: true },
  { level: 6.7, grade: '6th', quarter: 'q4', type: 'notes',     label: '6th Grade · Q4 · Notes' },
  { level: 6.8, grade: '6th', quarter: 'q4', type: 'fingering', label: '6th Grade · Q4 · Fingering', orchOnly: true },
  { level: 7.1, grade: '7th', quarter: 'q1', type: 'notes',     label: '7th Grade · Review · Notes' },
  { level: 7.2, grade: '7th', quarter: 'q1', type: 'fingering', label: '7th Grade · Review · Fingering', orchOnly: true },
];

// Band: Q1 = 5.1, Q2 = 5.2, Q3 = 5.3, Q4 = 5.4 (6th/7th grade band not built yet)
const BAND_LEVEL_SEQUENCE = [
  { level: 5.1, grade: '5th', quarter: 'q1', type: 'notes', label: '5th Grade · Q1 · Notes' },
  { level: 5.2, grade: '5th', quarter: 'q2', type: 'notes', label: '5th Grade · Q2 · Notes' },
  { level: 5.3, grade: '5th', quarter: 'q3', type: 'notes', label: '5th Grade · Q3 · Notes' },
  { level: 5.4, grade: '5th', quarter: 'q4', type: 'notes', label: '5th Grade · Q4 · Notes' },
];

// The level sequence for an instrument (defaults to the current student's)
function levelSequenceFor(instr) {
  instr = instr || getStudentInstrument();
  return instr.ensembleId === 'orchestra' ? LEVEL_SEQUENCE : BAND_LEVEL_SEQUENCE;
}

// Returns the INSTRUMENTS entry for the current student's instrument
// Roster spellings vary ("alto sax", "Saxophone", "Horn"…), so match loosely.
const INSTRUMENT_ALIASES = {
  'violin': 'violin', 'viola': 'viola', 'cello': 'cello', 'violoncello': 'cello',
  'bass': 'bass', 'string bass': 'bass', 'double bass': 'bass', 'upright bass': 'bass',
  'flute': 'flute',
  'clarinet': 'clarinet', 'bb clarinet': 'clarinet',
  'alto sax': 'alto-sax', 'alto saxophone': 'alto-sax', 'sax': 'alto-sax', 'saxophone': 'alto-sax',
  'french horn': 'french-horn', 'horn': 'french-horn', 'f horn': 'french-horn',
  'trumpet': 'trumpet', 'cornet': 'trumpet',
  'trombone': 'trombone',
  'baritone': 'baritone', 'euphonium': 'baritone', 'baritone horn': 'baritone',
  'tuba': 'tuba',
  // Roster lists percussionists as "Percussion" → 5th grade uses the High mallet quizzes
  'percussion': 'mallets-high', 'mallets': 'mallets-high', 'mallet percussion': 'mallets-high',
  'mallet percussion high': 'mallets-high', 'mallets high': 'mallets-high', 'high mallets': 'mallets-high',
  'mallet percussion low': 'mallets-low', 'mallets low': 'mallets-low', 'low mallets': 'mallets-low',
};
function findInstrument(name) {
  const key = String(name || '').trim().toLowerCase().replace(/[♭]/g, 'b').replace(/\s+/g, ' ');
  const id  = INSTRUMENT_ALIASES[key] || key.replace(/ /g, '-');
  return INSTRUMENTS.find(i => i.id === id || i.title.toLowerCase() === key) || null;
}
function getStudentInstrument() {
  const name = sessionStorage.getItem('studentInstrument') || 'Violin';
  const found = findInstrument(name);
  if (!found) console.warn('[pitch] Unknown instrument "' + name + '" — defaulting to Violin');
  return found || INSTRUMENTS[0];
}

// Returns folderId + quizId for a given LEVEL_SEQUENCE entry and instrument
function getLevelQuiz(entry, instr) {
  const folderId = FOLDER_MAP[instr.ensembleId + '|' + entry.grade + '|' + entry.quarter];
  if (!folderId) return null;
  const quizId = (entry.type === 'fingering') ? instr.quizIds[1] : instr.quizIds[0];
  if (!quizId) return null;
  const folder = getFolder(folderId);
  if (!folder) return null;
  const quiz = folder.quizzes.find(q => q.id === quizId);
  if (!quiz) return null;
  return { folderId, quizId };
}

// Returns the decimal level for the currently active quiz
function getCurrentLevel() {
  if (!activeFolder || !activeQuiz) return 0;
  const instr = getStudentInstrument();
  const type  = activeQuiz.id.includes('images/fingering') || activeQuiz.id.includes('fingering') ? 'fingering' : 'notes';
  const entry = levelSequenceFor(instr).find(e => {
    if (e.type !== type) return false;
    const fid = FOLDER_MAP[instr.ensembleId + '|' + e.grade + '|' + e.quarter];
    return fid === activeFolder.id;
  });
  return entry ? entry.level : 0;
}

// Launches quiz directly from a decimal level value
function launchLevel(levelVal) {
  const instr = getStudentInstrument();
  const entry = levelSequenceFor(instr).find(e => Math.abs(e.level - levelVal) < 0.05);
  if (!entry) { renderLevelMenu(); return; }
  const q     = getLevelQuiz(entry, instr);
  if (!q) { renderLevelMenu(); return; }
  activeInstrument = instr;
  activeEnsemble   = ENSEMBLES.find(e => e.id === instr.ensembleId);
  activeGrade      = entry.grade;
  startQuiz(q.folderId, q.quizId);
}

// ── LEVEL MENU SCREEN ─────────────────────────────────────────────────────────
function renderLevelMenu() {
  const instr    = getStudentInstrument();
  const isOrch   = instr.ensembleId === 'orchestra';
  const is7th    = sessionStorage.getItem('studentGrade') === '7';
  const maxBase  = (!is7th && _maxLevel) ? parseInt(_maxLevel) : null;
  const bestBase = Math.floor(_bestLevel);
  const bestSub  = Math.round((_bestLevel - bestBase) * 10);

  // Levels for this instrument type
  const levels = levelSequenceFor(instr);

  let cards = levels.map(entry => {
    const locked   = maxBase && (
      Math.floor(entry.level) > maxBase ||
      (Math.floor(entry.level) === maxBase && Math.round((entry.level - Math.floor(entry.level)) * 10) > Math.round((_maxLevel - maxBase) * 10))
    );
    const available = getLevelQuiz(entry, instr) !== null;
    if (!available) return ''; // quiz not built yet

    const levelStr = entry.level.toFixed(1);
    const lockSvg  = locked ? `
      <span style="position:absolute;inset:0;background:rgba(59,110,248,0.08);border-radius:12px;display:flex;align-items:center;justify-content:center;z-index:2;">
        <svg width="22" height="28" viewBox="0 0 36 44" fill="none">
          <rect x="2" y="18" width="32" height="24" rx="4" fill="#3b6ef8" opacity="0.7"/>
          <path d="M10 18V13C10 8.03 13.13 4 18 4C22.87 4 26 8.03 26 13V18" stroke="#3b6ef8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>
          <circle cx="18" cy="30" r="3.5" fill="white"/>
          <rect x="16.25" y="30" width="3.5" height="5" rx="1" fill="white"/>
        </svg>
      </span>` : '';

    const typeColor = entry.type === 'fingering' ? '#7c3aed' : '#3b6ef8';
    const typeLabel = entry.type === 'fingering' ? 'Fingering' : 'Notes';

    return `
      <div onclick="${locked ? '' : 'launchLevel(' + entry.level + ')'}"
        style="position:relative;display:flex;align-items:center;gap:14px;
               padding:14px 16px;background:#fff;border:1.5px solid #dde3f0;
               border-radius:12px;cursor:${locked ? 'default' : 'pointer'};
               transition:border-color 0.15s,box-shadow 0.15s;-webkit-tap-highlight-color:transparent;"
        onmouseenter="if(!${locked}) this.style.borderColor='#3b6ef8'"
        onmouseleave="this.style.borderColor='#dde3f0'">
        <div style="width:44px;height:44px;border-radius:10px;background:#e8effe;
                    display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span style="font-family:'DM Serif Display',serif;font-weight:700;color:#3b6ef8;font-size:1rem;">${levelStr}</span>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:0.9rem;color:#1a1f36;">${entry.label.split(' · ').slice(0,2).join(' · ')}</div>
          <div style="font-size:0.76rem;margin-top:2px;">
            <span style="background:${typeColor}1a;color:${typeColor};padding:2px 8px;border-radius:99px;font-weight:600;">${typeLabel}</span>
          </div>
        </div>
        <span style="color:#6b7280;font-size:1.2rem;">${locked ? '' : '›'}</span>
        ${lockSvg}
      </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div style="font-family:DM Sans,sans-serif;padding:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <div>
          <div style="font-family:'DM Serif Display',serif;font-size:1.4rem;color:#1a1f36;letter-spacing:-0.02em;">Note ID</div>
          <div style="font-size:0.8rem;color:#6b7280;margin-top:2px;">${instr.title} · Choose a level</div>
        </div>
        <a href="dashboard.html" style="font-size:0.78rem;color:#3b6ef8;font-weight:600;text-decoration:none;">← Dashboard</a>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">${cards}</div>
    </div>`;
}

// ── PITCH TEACHER MODE ───────────────────────────────────────────────────────
// Uses the real quiz UI (launchLevel → renderQuestion → auto-advance).
// A fixed banner sits on top with student name + teacher controls.
let _ptStudents = [];
let _ptMode     = '';

function _ptClosestNotesLevel(lvl) {
  const seq   = levelSequenceFor();
  const notes = seq.filter(e => e.type === 'notes' && e.level <= lvl + 0.05);
  if (!notes.length) return seq.find(e => e.type === 'notes');
  return notes.reduce((best, e) => (e.level > best.level ? e : best));
}

function _ptMedianLevel(students) {
  const levels = students.map(s => parseFloat(s.highestLevel) || 0).sort((a,b) => a-b);
  if (levels.filter(l => l === 0).length > students.length / 2) return 5.1;
  const mid = Math.floor(levels.length / 2);
  return levels.length % 2 === 0 ? (levels[mid-1] + levels[mid]) / 2 : levels[mid];
}

// ── Teacher banner (fixed top bar) ────────────────────────────────────────────
function ptAddBanner(name, showNewStudent) {
  let b = document.getElementById('pt-banner');
  if (!b) {
    b = document.createElement('div');
    b.id = 'pt-banner';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;' +
      'background:#1a1f36;color:white;padding:8px 16px;display:flex;align-items:center;gap:10px;' +
      'font-family:DM Sans,sans-serif;';
    b.innerHTML = '<span id="pt-banner-name" style="font-size:1.1rem;font-weight:700;flex:1;color:white;"></span>' +
      '<button onclick="ptNewNote()" style="padding:6px 14px;border-radius:7px;border:1.5px solid #3b4b6b;background:transparent;color:#a8b3d0;font-family:DM Sans,sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;">New Note</button>' +
      '<button id="pt-new-student-banner-btn" onclick="ptNewStudent()" style="display:none;padding:6px 14px;border-radius:7px;border:none;background:#3b6ef8;color:white;font-family:DM Sans,sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;">New Student</button>' +
      '<button onclick="ptBack()" style="padding:6px 14px;border-radius:7px;border:1.5px solid #3b4b6b;background:transparent;color:#a8b3d0;font-family:DM Sans,sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;">← Back</button>';
    document.body.prepend(b);
    document.body.style.paddingTop = '44px';
  }
  document.getElementById('pt-banner-name').textContent = name || '';
  const nsb = document.getElementById('pt-new-student-banner-btn');
  if (nsb) nsb.style.display = showNewStudent ? '' : 'none';
}

function ptLaunchLevel(lvl, instrTitle, studentName) {
  sessionStorage.setItem('studentInstrument', instrTitle);
  ptAddBanner(studentName || '', _ptMode === 'random');
  const entry = _ptClosestNotesLevel(lvl);
  if (entry) launchLevel(entry.level);
}

function ptNewNote() {
  // Advance to next question in the current active quiz
  if (typeof nextQuestion === 'function') nextQuestion();
}

function ptNewStudent() {
  if (!_ptStudents.length) return;
  const instrParam = new URLSearchParams(window.location.search).get('teacherInstrument') || 'Violin';
  const s = _ptStudents[Math.floor(Math.random() * _ptStudents.length)];
  const instrTitle = s.instrument
    ? (s.instrument.charAt(0).toUpperCase() + s.instrument.slice(1).toLowerCase())
    : instrParam;
  ptLaunchLevel(parseFloat(s.highestLevel) || 5.1, instrTitle, s.firstName);
}

function ptBack() {
  document.body.style.paddingTop = '';
  const b = document.getElementById('pt-banner'); if (b) b.remove();
  if (window.parent !== window) window.parent.postMessage({ type:'ptBack' }, '*');
  else renderLevelMenu();
}

async function initPitchTeacherMode() {
  const params       = new URLSearchParams(window.location.search);
  const cls          = params.get('teacherClass')      || '';
  const mode         = params.get('teacherMode')       || 'median';
  const instrDef     = params.get('teacherInstrument') || 'Violin';
  const studentsJSON = params.get('teacherStudents');
  _ptMode = mode;

  const instrTitle = instrDef.charAt(0).toUpperCase() + instrDef.slice(1).toLowerCase();

  if (!cls) {
    ptLaunchLevel(5.1, instrTitle, null);
    return;
  }

  // Fast path: teacher.html pre-computed the student list — no GAS cold-start needed
  if (studentsJSON) {
    try { _ptStudents = JSON.parse(studentsJSON); } catch(e) { _ptStudents = []; }
    if (mode === 'median') {
      ptLaunchLevel(_ptMedianLevel(_ptStudents), instrTitle, null);
    } else {
      const s = _ptStudents[Math.floor(Math.random() * _ptStudents.length)];
      ptLaunchLevel(parseFloat(s ? s.highestLevel : 0) || 5.1,
                    s ? s.instrument : instrTitle, s ? s.firstName : null);
    }
    return;
  }

  try {
    const res  = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'getTeacherData' }), redirect:'follow' });
    const data = await res.json();
    const pitchScores = (data.bestScores || []).filter(b => b.moduleId === 'note_id');

    _ptStudents = (data.students || [])
      .filter(s => s.class === cls)
      .map(s => {
        const best = pitchScores.filter(b => b.studentNumber === s.studentNumber)
          .reduce((m, b) => (!m || b.level > m.level ? b : m), null);
        return { firstName: s.firstName,
                 instrument: s.instrument ? (s.instrument.charAt(0).toUpperCase()+s.instrument.slice(1).toLowerCase()) : instrTitle,
                 highestLevel: best ? best.level : 0 };
      });

    if (mode === 'median') {
      ptLaunchLevel(_ptMedianLevel(_ptStudents), instrTitle, null);
    } else {
      const s = _ptStudents[Math.floor(Math.random() * _ptStudents.length)];
      ptLaunchLevel(parseFloat(s ? s.highestLevel : 0) || 5.1,
                    s ? s.instrument : instrTitle, s ? s.firstName : null);
    }
  } catch(e) {
    console.error('Pitch teacher mode error:', e);
    ptLaunchLevel(5.1, instrTitle, null);
  }
}

// ── INIT ─────────────────────────────────────────────────────────
function initApp() {
  if (_teacherMode) { initPitchTeacherMode(); return; }
  if (_urlLevel && !_urlMenu) {
    launchLevel(_urlLevel);
    return;
  }
  // 7th graders default directly into level 7.1 (all prior levels already unlocked)
  if (!_urlMenu && sessionStorage.getItem('studentGrade') === '7') {
    launchLevel(7.1);
    return;
  }
  renderLevelMenu();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
